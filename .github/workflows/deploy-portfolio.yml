name: Deploy Business Analyst Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest website files
        uses: actions/checkout@v4

      - name: Validate pages and local links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import re
          root = Path.cwd().resolve()
          pages = [root / "index.html", *sorted((root / "projects").glob("*.html"))]
          assert all(page.is_file() for page in pages), "Missing website HTML file"
          assert (root / "assets" / "Sabri_Mazahim_Business_Analyst_CV.pdf").is_file(), "Missing current CV PDF"
          assert 'id="experience"' in pages[0].read_text(encoding="utf-8"), "Missing experience anchor"
          missing = []
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for link in re.findall(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']', html):
                  parsed = urlsplit(link)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  destination = (page.parent / unquote(parsed.path)).resolve()
                  if not destination.is_relative_to(root) or not destination.is_file():
                      missing.append((str(page.relative_to(root)), link))
          if missing:
              raise SystemExit(f"Missing local references: {missing}")
          print(f"Checked {len(pages)} pages; all local links resolve.")
          PY

      - name: Assemble site from current repository content
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -a assets documents projects _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
