<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current and future process flows" viewBox="0 0 1120 390"><rect width="1120" height="390" rx="20" fill="#f6f8fc"/><text x="34" y="38" font-size="21" font-weight="700" fill="#203b53" font-family="Arial">CURRENT STATE — AS-IS</text><rect x="22" y="59" width="196" height="108" rx="12" fill="#fee5d8" stroke="#b45e37" stroke-width="1.4"/><text x="120" y="95" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">Supplier delivers</text><text x="120" y="115" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">goods</text><path d="M 222 114 h 13 m -6 -6 l 6 6 -6 6" stroke="#b45e37" stroke-width="2" fill="none"/><rect x="241" y="59" width="196" height="108" rx="12" fill="#fee5d8" stroke="#b45e37" stroke-width="1.4"/><text x="339" y="105" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">Manual count on paper</text><path d="M 441 114 h 13 m -6 -6 l 6 6 -6 6" stroke="#b45e37" stroke-width="2" fill="none"/><rect x="460" y="59" width="196" height="108" rx="12" fill="#fee5d8" stroke="#b45e37" stroke-width="1.4"/><text x="558" y="95" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">Paper retained until</text><text x="558" y="115" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">end of shift</text><path d="M 660 114 h 13 m -6 -6 l 6 6 -6 6" stroke="#b45e37" stroke-width="2" fill="none"/><rect x="679" y="59" width="196" height="108" rx="12" fill="#fee5d8" stroke="#b45e37" stroke-width="1.4"/><text x="777" y="95" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">Clerk retypes quantity</text><text x="777" y="115" font-size="15.5" text-anchor="middle" fill="#1d3a4b" font-family="Arial">into Excel</text><path d="M 879 114 h 13 m -6 -6 l 6 6 -6 6" stroke="#b45e37" stroke-width="2" fill="none"/><rect x="898" y="59" width="196" height="108" rx="12" fill="#fee5d8" stroke="#b45e37" stroke-width="1.4